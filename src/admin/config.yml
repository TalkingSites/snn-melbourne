backend:
  name: github
  # Spacedash: server.js fills in this site's repo and points sign-in (Authentik) and
  # GitHub calls at itself, using whichever address the CMS is opened on
  repo: TalkingSites/spaceclub-template
  branch: main
  base_url: http://localhost:3000
  auth_endpoint: api/auth
  # Set by .github/workflows/preview-status.yml, shown as the "View preview" link
  preview_context: deploy/preview
  commit_messages:
    create: "Adds {{collection}} {{slug}} ({{author-name}})"
    update: "Updates {{collection}} {{slug}} ({{author-name}})"
    delete: "Deletes {{collection}} {{slug}} ({{author-name}})"
    uploadMedia: "Uploads {{path}} ({{author-name}})"
    deleteMedia: "Deletes {{path}} ({{author-name}})"

# Every edit becomes a pull request, nothing goes live until it's merged
publish_mode: editorial_workflow

# `npx decap-server` + the Eleventy dev server edits local files without signing in
# (server.js leaves this out, so the built site always signs in with Authentik)
local_backend: { url: "http://localhost:8151/api/v1" }

site_url: http://localhost:8150
display_url: http://localhost:8150

media_folder: src/assets/images/uploads
public_folder: /assets/images/uploads

collections:
  # Every page is a file in src/pages, so new ones can be made here. A page lives at
  # /<file name>/ unless its file says otherwise (Home is "/", 404 is "/404.html"); its
  # layout is base.njk unless its file says otherwise (Home uses index.njk). Those stay in
  # the files and aren't shown. Pages open in the visual editor, where partials are blocks.
  - name: pages
    label: Pages
    label_singular: Page
    folder: src/pages
    extension: md
    format: frontmatter
    create: true
    slug: "{{slug}}"
    summary: "{{title}}"
    sortable_fields: [title]
    fields:
      - { name: layout, widget: hidden, default: base.njk }
      # SpaceDash shows this as the page's Address (/about/); without SpaceDash it stays hidden
      - { label: Address, name: permalink, widget: hidden, required: false }
      - { label: Title, name: title, widget: string }
      - { label: Show in the menu, name: menu, widget: boolean, required: false, default: false, hint: "Lists this page under Pages in the navbar" }
      - { label: Description, name: description, widget: text, required: false, hint: "Shown in search results and link previews" }
      - { label: Body, name: body, widget: markdown, modes: [rich_text, raw], required: false }

  - name: settings
    label: Settings
    files:
      - label: Site
        name: site
        file: src/_data/site.json
        fields:
          - { label: Site name, name: title, widget: string }
          - { label: Description, name: description, widget: text }
          - { label: Logo, name: logo, widget: image }
          - { label: Favicon, name: favicon, widget: image }
          - { label: Search heading, name: searchTitle, widget: string }
          - { label: Search placeholder, name: searchPlaceholder, widget: string }
          - { name: baseUrl, widget: hidden }
          - { name: timezone, widget: hidden }
          - { name: dateFormat, widget: hidden }
          # set by Mission Control when the site was launched
          - { name: url, widget: hidden }
          - { name: matomo, widget: hidden }
      - label: Navigation
        name: navigation
        file: src/_data/navbar.json
        fields:
          - label: Menu links
            name: items
            widget: list
            summary: "{{fields.title}} → {{fields.href}}"
            fields:
              - { label: Label, name: title, widget: string }
              - { label: Link, name: href, widget: string, hint: "e.g. /about or https://..." }
              - { label: Also in footer, name: footer, widget: boolean, default: true, required: false }
      - label: Programme
        name: day
        file: src/_data/day.json
        fields:
          - label: Event
            name: event
            widget: object
            fields:
              - { label: Name, name: name, widget: string }
              - { label: Year, name: year, widget: string }
              - { label: Big question, name: lead, widget: text }
              - { label: Date, name: date, widget: string }
              - { label: Date (for the live marker), name: isoDate, widget: datetime, format: YYYY-MM-DD, date_format: YYYY-MM-DD, time_format: false }
              - { label: Place, name: place, widget: string }
              - { label: Register link, name: register, widget: string }
              - { label: Full schedule link, name: schedule, widget: string }
          - label: Tracks
            name: tracks
            widget: object
            fields:
              - { label: Track A, name: a, widget: object, fields: [{ label: Letter, name: letter, widget: string }, { label: Name, name: name, widget: string }] }
              - { label: Track B, name: b, widget: object, fields: [{ label: Letter, name: letter, widget: string }, { label: Name, name: name, widget: string }] }
          - &plenary
            label: Opening
            name: opening
            widget: object
            fields:
              - { name: id, widget: hidden }
              - { label: Time, name: time, widget: string }
              - { label: Ends, name: end, widget: string }
              - { label: Length, name: length, widget: string }
              - { label: Label, name: label, widget: string }
              - { label: Title, name: title, widget: string }
              - { label: One line, name: lead, widget: string }
              - label: People
                name: people
                widget: list
                summary: "{{fields.name}}"
                fields:
                  - { label: Name, name: name, widget: string }
                  - { label: Photo, name: photo, widget: image }
                  - { label: Role, name: role, widget: string }
              - { label: Paragraphs, name: text, widget: list, field: { label: Paragraph, name: paragraph, widget: text } }
              - { label: Room, name: room, widget: string }
              - { label: ConfEngine link, name: link, widget: string }
          - label: Between opening and round 1
            name: challenge
            widget: object
            fields:
              - { label: Time, name: time, widget: string }
              - { label: Label, name: label, widget: string }
              - { label: Length, name: length, widget: string }
          - label: Rounds
            name: rounds
            widget: list
            summary: "Round {{fields.n}}: {{fields.a.code}} {{fields.a.name}} + {{fields.b.code}} {{fields.b.name}}"
            fields:
              - { label: Round number, name: n, widget: number }
              - { label: Rib sessions start, name: ribsTime, widget: string }
              - { label: Rib sessions end, name: ribsEnd, widget: string }
              - { label: Spine sessions start, name: spineTime, widget: string }
              - { label: Spine sessions end, name: spineEnd, widget: string }
              - label: Break before the spines
                name: break
                widget: object
                fields:
                  - { label: Time, name: time, widget: string }
                  - { label: Label, name: label, widget: string }
                  - { label: Place, name: place, widget: string }
                  - { label: Length, name: length, widget: string }
              - &question
                label: Track A question
                name: a
                widget: object
                summary: "{{fields.code}} {{fields.name}}"
                fields:
                  - { label: Code, name: code, widget: string, hint: "e.g. A1" }
                  - { label: Name, name: name, widget: string }
                  - { label: Question, name: question, widget: text }
                  - label: Rib sessions
                    name: ribs
                    widget: list
                    summary: "{{fields.format}}: {{fields.title}}"
                    fields:
                      - { name: id, widget: hidden }
                      - { label: Format, name: format, widget: string }
                      - { label: Title, name: title, widget: string }
                      - &people
                        label: People
                        name: people
                        widget: list
                        summary: "{{fields.name}}"
                        fields:
                          - { label: Name, name: name, widget: string }
                          - { label: Photo, name: photo, widget: image }
                          - { label: "Role (when people have different ones)", name: role, widget: string, required: false }
                      - { label: Role, name: role, widget: string, required: false }
                      - { label: About, name: text, widget: text }
                      - { label: Room, name: room, widget: string }
                      - { label: ConfEngine link, name: link, widget: string }
                  - label: Spine session
                    name: spine
                    widget: object
                    fields:
                      - { name: id, widget: hidden }
                      - { label: Title, name: title, widget: string }
                      - *people
                      - { label: Role, name: role, widget: string }
                      - { label: About, name: text, widget: text }
                      - { label: Room, name: room, widget: string }
              - <<: *question
                label: Track B question
                name: b
          - <<: *plenary
            label: Closing
            name: closing
          - label: After the closing
            name: after
            widget: object
            fields:
              - { label: Time, name: time, widget: string }
              - { label: Label, name: label, widget: string }
              - { label: Place, name: place, widget: string }
              - { label: Length, name: length, widget: string }
